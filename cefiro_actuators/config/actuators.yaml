cefiro_actuators:
  ros__parameters:
    use_sim_time: false
    frame_id: drone_body_link

    # Published ROS->Gazebo motor channels are ignored until a Gazebo plugin is loaded.
    dynamics_rate_hz: 1000.0
    telemetry_rate_hz: 100.0
    command_watchdog_s: 0.5

    # 750 Kv refers to the D3536 motor in the supplied reference.
    # ALL remaining numeric values are provisional pending bench characterization.
    motor.kv_rpm_per_volt: 750.0
    motor.resistance_ohm: 0.30
    motor.inductance_h: 0.0001
    motor.rotor_prop_inertia_kg_m2: 0.00004
    motor.current_limit_a: 35.0
    motor.no_load_current_a: 0.65
    motor.viscous_friction_nm_per_rad_s: 0.000004
    motor.max_rpm: 20000.0

    # Replace the diameter with the CEFIRO-installed propeller, not a mesh size.
    propeller.diameter_m: 0.254
    propeller.ct: 0.10
    propeller.cq: 0.015
    environment.air_density_kg_m3: 1.225

    esc.time_constant_s: 0.025
    esc.minimum_spinning_duty: 0.035
    esc.active_braking: false

    battery.nominal_voltage_v: 12.63
    battery.internal_resistance_ohm: 0.03
