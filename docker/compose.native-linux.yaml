# Native Ubuntu X11/XWayland: displays Qt/Gazebo/RViz as desktop windows.
# Run `xhost +si:localuser:$(whoami)` is NOT sufficient for an arbitrary container UID;
# use the short-lived xauth-based approach in README for better security.
services:
  sim:
    command: ["sleep", "infinity"]
    volumes:
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        read_only: true
      - type: bind
        source: ${XAUTHORITY_FILE:-/tmp/cefiro-docker.xauth}
        target: /tmp/cefiro-docker.xauth
        read_only: true
    # The cookie is generated on the host; no global `xhost +` required.
    environment:
      DISPLAY: "${DISPLAY:?Set DISPLAY in the Ubuntu host}"
      XAUTHORITY: /tmp/cefiro-docker.xauth
      LIBGL_ALWAYS_SOFTWARE: "0"
      QT_X11_NO_MITSHM: "1"
