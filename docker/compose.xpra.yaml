# Use alongside docker/compose.yaml:
# docker compose -f compose.yaml -f compose.xpra.yaml up -d --build xpra
services:
  xpra:
    image: cefiro:xpra-jazzy-harmonic
    build:
      context: .
      dockerfile: Dockerfile.xpra
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    shm_size: "1gb"
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: file:///etc/cefiro/cyclonedds.xml
      ROS_LOG_DIR: /cefiro_data/log
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"
      XPRA_PASSWORD: "${XPRA_PASSWORD:?Set XPRA_PASSWORD in docker/.env before starting Xpra}"
    ports:
      # ONLY accessible from this Windows PC. Do not expose on the LAN.
      - "127.0.0.1:${XPRA_PORT:-14500}:14500"
    volumes:
      - type: bind
        source: ..
        target: /cefiro_ws/src/PROJECT-CEFIRO
      - type: bind
        source: ../.docker-data/install
        target: /cefiro_ws/install
      - type: bind
        source: ../.docker-data/log
        target: /cefiro_data/log
      - type: bind
        source: ../.docker-data/records
        target: /cefiro_data/records
      - type: bind
        source: ../.docker-data/build
        target: /cefiro_ws/build
    networks:
      cefiro_ros:
        aliases: [xpra]
