name: cefiro

x-cefiro-environment: &cefiro-environment
  ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
  ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  CYCLONEDDS_URI: file:///etc/cefiro/cyclonedds.xml
  ROS_LOG_DIR: /cefiro_data/log

services:
  sim:
    image: cefiro:jazzy-harmonic
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEV_UID: "${LOCAL_UID:-1000}"
        DEV_GID: "${LOCAL_GID:-1000}"
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    shm_size: "1gb"
    environment:
      <<: *cefiro-environment
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"
    ports:
      # Localhost only. The browser desktop is not authenticated.
      - "127.0.0.1:${NOVNC_PORT:-6080}:6080"
    volumes:
      - type: bind
        source: ..
        target: /cefiro_ws/src/PROJECT-CEFIRO
      - type: bind
        source: ../.docker-data/install
        target: /cefiro_ws/install
      - type: bind
        source: ../.docker-data/log
        target: /cefiro_data/log
      - type: bind
        source: ../.docker-data/records
        target: /cefiro_data/records
      - type: bind
        source: ../.docker-data/build
        target: /cefiro_ws/build
    networks:
      cefiro_ros:
        aliases: [sim]

  observer:
    image: cefiro:jazzy-harmonic
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["sleep", "infinity"]
    environment:
      <<: *cefiro-environment
    volumes:
      - type: bind
        source: ..
        target: /cefiro_ws/src/PROJECT-CEFIRO
        read_only: true
      - type: bind
        source: ../.docker-data/install
        target: /cefiro_ws/install
        read_only: true
      - type: bind
        source: ../.docker-data/log
        target: /cefiro_data/log
      - type: bind
        source: ../.docker-data/records
        target: /cefiro_data/records
    networks:
      cefiro_ros:
        aliases: [observer]
    depends_on:
      - sim

  # Optional: Windows Docker (domain 42) -> Pi (domain 30) read-only telemetry bridge.
  # Enable with: docker compose --profile pi up -d sim observer zenoh
  # The Pi bridge must be started separately on 192.168.68.59:7447.
  zenoh:
    profiles: ["pi"]
    image: eclipse/zenoh-bridge-ros2dds:1.10.1
    init: true
    restart: unless-stopped
    command: ["-c", "/etc/cefiro/zenoh-windows.json5"]
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
      CYCLONEDDS_URI: file:///etc/cefiro/cyclonedds.xml
    volumes:
      - type: bind
        source: ./config/cyclonedds.xml
        target: /etc/cefiro/cyclonedds.xml
        read_only: true
      - type: bind
        source: ./config/zenoh-windows.json5
        target: /etc/cefiro/zenoh-windows.json5
        read_only: true
    networks:
      cefiro_ros:
        aliases: [zenoh]

networks:
  cefiro_ros:
    driver: bridge
