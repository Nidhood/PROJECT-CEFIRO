cefiro_hmi:
  ros__parameters:
    use_sim_time: true
    # Show simulation attitude relative to the nominal URDF gimbal pose.
    # Disable for hardware GUI configurations.
    display_relative_attitude: true
    equilibrium_world_yaw_deg: 151.318
    imu_topic: /imu/data
    magnetometer_topic: /magnetometer/data
    barometer_topic: /bmp581/air_pressure
    reference_topic: /cefiro/control/attitude_reference
    enable_topic: /cefiro/control/enable
    stop_topic: /cefiro/control/emergency_stop
    mode_topic: /cefiro/control/mode
    strategy_topic: /cefiro/control/strategy
    status_topic: /cefiro/control/status
    hardware_status_topic: /real/cefiro/hardware/status # host-confirmed DShot settings and command requests
    pid_gains_topic: /cefiro/control/pid_gains
    lqr_gain_topic: /cefiro/control/lqr_gain
