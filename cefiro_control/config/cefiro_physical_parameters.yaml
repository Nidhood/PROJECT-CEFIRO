cefiro_physical_parameters:
  ros parameters:
    mass: 1.2 # kg

    inertia:
      jx: 0.01 # kg*m^2
      jy: 0.01 # kg*m^2
      jz: 0.02 # kg*m^2

    mixer:
      arm_length: 0.25      # l: Longitud del brazo desde el centro de masa al motor [m]
      thrust_coeff: 1.2e-6  # b: Coeficiente de empuje [N/(RPM^2)]
      drag_coeff: 2.5e-8    # d: Coeficiente de arrastre/torque [N*m/(RPM^2)]
      frame_type: "cross"   # Configuración de los brazos: "cross" (X)
      
      # En configuración 'X', el brazo efectivo proyectado sobre los ejes X e Y es l * sin(45°)
      arm_angle_deg: 45.0   # Ángulo de los brazos respecto a los ejes principales

      # Matriz de signos/contribución por motor para configuración en 'X':
      # Motor 1: Frontal-Derecho (CCW)  | Motor 2: Frontal-Izquierdo (CW)
      # Motor 3: Posterior-Izquierdo (CCW) | Motor 4: Posterior-Derecho (CW)

      motor_matrix_signs:
        # [Roll (tau_phi), Pitch (tau_theta), Yaw (tau_psi)]
        motor_1: [-1.0,  1.0, -1.0]   # Frontal-Derecho
        motor_2: [ 1.0,  1.0,  1.0]   # Frontal-Izquierdo
        motor_3: [ 1.0, -1.0, -1.0]   # Posterior-Izquierdo
        motor_4: [-1.0, -1.0,  1.0]   # Posterior-Derecho