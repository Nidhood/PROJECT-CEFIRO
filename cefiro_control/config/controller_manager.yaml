controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    cefiro_attitude_controller:
      type: cefiro_control/CefiroAttitudeController

cefiro_attitude_controller:
  ros__parameters:
    joints:
      - motor_1
      - motor_2
      - motor_3
      - motor_4
    interface_name: rpm
    reference_topic: ~/reference

    imu_sensor_name: imu_sensor
    barometer_sensor_name: barometer_sensor
    magnetometer_sensor_name: magnetometer_sensor

    gains:
      control_gains:
        k_matrix: [
          1.414, 0.0,   0.0,   1.422, 0.0,   0.0,
          0.0,   1.414, 0.0,   0.0,   1.422, 0.0,
          0.0,   0.0,   1.414, 0.0,   0.0,   1.427
        ]
        k_rows: 3
        k_cols: 6
      
      observer_gains:
        l_matrix: [
          5.0000,   0.0000,   0.0000,   0.0000,   0.0000,   0.0000,
          0.0000, 942.7958,   0.0000,   0.0000,   0.0000,   0.0000,
          0.0000,   0.0000, 543.9053,   0.0000,   0.0000,   0.0000,
          1.0000,   0.0000,   0.0000, 942.7958,   0.0000,   0.0000,
          0.0000,   1.0000,   0.0000,   0.0000,   5.0000,   0.0000,
          0.0000,   0.0000,   1.0000,   0.0000,   0.0000,   5.0000
        ]
        l_rows: 6
        l_cols: 6

    limits:
      min_output: 320.0
      max_output: 1600.0
      max_torque: 0.01

    nominal_rpm: 500.0