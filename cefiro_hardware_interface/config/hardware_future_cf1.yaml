/**:
  ros__parameters:
    use_sim_time: false
    port: /dev/ttyUSB0
    baudrate: 115200
    protocol_mode: cf1
    # Modular FMU does implement CF1, but TX remains OFF until bench validation.
    enable_command_tx: false
    allow_direction_commands: false  # current STM32 does not support CMD_DIR
    allow_direct_dshot: false
    rpm_to_dshot_enabled: false # explicit opt-in for GUI manual conversion
    rpm_full_scale: 12000.0    # GUI nominal scale, NOT measured motor RPM
    rpm_deadband: 25.0        # near-zero requests -> stop code 0
    dshot_min: 48             # DSHOT 1..47 are SPECIAL commands, never use as throttle
    dshot_max: 300 # Conservative commissioning default; explicitly choose 2047 only after bench validation
    serial_reconnect_s: 2.0
    sensor_stale_s: 1.5
    command_timeout_s: 0.60 # max GUI silence; MCU still uses 300 ms DShot TTL
    manual_keepalive_period_s: 0.040 # Raspberry re-sends fresh DShot every 40 ms
    orientation_timeout_s: 0.2
    max_command_rpm: 12000.0
    imu_frame_id: cefiro_fmu_imu
    mag_frame_id: cefiro_fmu_mag
    baro_frame_id: cefiro_fmu_baro
    body_frame_id: drone_body_link
